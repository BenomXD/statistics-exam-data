<style>
*{box-sizing:border-box}
body{font-family:Arial,Helvetica,sans-serif;margin:0;background:#f5f7fa;color:#17202a}
.wrap{max-width:1100px;margin:auto;padding:22px 16px 60px}
.card{background:#fff;border:1px solid #d8dee6;border-radius:14px;padding:20px;margin:16px 0;box-shadow:0 2px 10px rgba(0,0,0,.04)}
h1{margin:0 0 8px;font-size:25px} h2{margin:0 0 14px;font-size:21px} h3{margin:0 0 12px}
.note{color:#586473;font-size:13px;line-height:1.45}
.code{display:inline-block;background:#fff7db;border:1px solid #e8d58c;border-radius:8px;padding:8px 12px;font-weight:800;letter-spacing:.5px;margin-bottom:10px}
nav{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}
nav a{background:#fff;border:1px solid #d8dee6;padding:7px 10px;border-radius:8px;text-decoration:none;font-weight:700;color:#2057a6}
.formulas{display:flex;flex-direction:column;gap:16px}
.formula{border:1px solid #d5ddd8;border-radius:12px;padding:18px;width:100%;background:#fff}
.eq{font-family:"Cambria Math","STIX Two Math","Times New Roman",serif;font-size:clamp(22px,2.5vw,32px);text-align:center;min-height:112px;padding:14px 8px;display:flex;align-items:center;justify-content:center;overflow:visible}
.eq math{font-size:1em;white-space:nowrap}
.tpl{background:#f1f3f5;border-radius:8px;padding:9px 10px;font-family:Consolas,monospace;font-size:13px;overflow:auto}
.symbols{font-size:13px;color:#4c5966;line-height:1.5;margin-top:10px}
.table-title{font-weight:800;font-size:17px;margin:12px 0 7px}
.tw{overflow:auto;margin-bottom:14px}
table{border-collapse:collapse;background:#fff}
th,td{border:1px solid #9fa9b4;padding:8px 11px;text-align:center;white-space:nowrap}
th{background:#eef2f6}
.raw{table-layout:fixed;width:min(100%,680px)}
.raw td{width:auto}
.data-table{min-width:560px}
.copy{border:0;border-radius:9px;background:#12834f;color:#fff;font-weight:800;padding:11px 15px;cursor:pointer}
.copy:hover{filter:brightness(.96)}
#status{font-weight:700}
</style>

function b64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

async function decrypt(){
  const token=new URLSearchParams(location.search).get('t');
  if(!token) throw new Error('missing');
  const digest=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(token));
  const key=await crypto.subtle.importKey('raw',digest,{name:'AES-GCM'},false,['decrypt']);
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(IV)},key,b64(CT));
  return JSON.parse(new TextDecoder().decode(plain));
}

function tableHTML(t){
  let h=`<div class="table-title">${esc(t.title)}</div><div class="tw"><table class="${t.raw?'raw':'data-table'}">`;
  if(t.headers && t.headers.length) h += '<thead><tr>'+t.headers.map(v=>`<th>${esc(v)}</th>`).join('')+'</tr></thead>';
  h+='<tbody>'+t.rows.map(r=>'<tr>'+r.map(v=>`<td>${esc(v)}</td>`).join('')+'</tr>').join('')+'</tbody></table></div>';
  return h;
}

function tsvForBlock(b){
  return b.tables.map(t=>{
    let lines=[];
    if(t.headers && t.headers.length) lines.push(t.headers.join('\t'));
    for(const r of t.rows) lines.push(r.join('\t'));
    return lines.join('\n');
  }).join('\n\n');
}

async function copyBlock(i,btn){
  const txt=tsvForBlock(window.DATA.blocks[i]);
  await navigator.clipboard.writeText(txt);
  const old=btn.textContent;
  btn.textContent='COPIED — PASTE IN EXCEL';
  setTimeout(()=>btn.textContent=old,1400);
}

const formulaHTML=`
<section class="card">
<h2>Grouped-data formulas</h2>
<div class="formulas">

<div class="formula">
<h3>Grouped mean</h3>
<div class="eq">
<math display="block">
  <mrow>
    <msub><mover accent="true"><mi>x</mi><mo>¯</mo></mover><mi>g</mi></msub>
    <mo>=</mo>
    <mfrac>

  </mrow>
</math>
</div>
<div class="tpl">=SUMA(fi_xi)/SUMA(fi)</div>
<div class="symbols"><b>fi_xi</b>: the already-calculated <i>f</i><sub>i</sub>×<i>x</i><sub>i</sub> column · <b>fi</b>: frequency column · <b>n</b>: total frequency.</div>
</div>

<div class="formula">

<div class="eq">
<math display="block">

    <mo>=</mo>
    <msub><mi>L</mi><mi>m</mi></msub>
    <mo>+</mo>
    <mrow>
      <mo>(</mo>
      <mfrac>

        <msub><mi>f</mi><mi>m</mi></msub>
      </mfrac>
      <mo>)</mo>
    </mrow>
    <mi>h</mi>
  </mrow>
</math>
</div>
<div class="tpl">=L_m+((n/2-F_prev)/f_m)*h</div>
<div class="symbols"><b>L<sub>m</sub></b>: lower limit of median class · <b>F<sub>prev</sub></b>: cumulative frequency before the median class · <b>f<sub>m</sub></b>: median-class frequency · <b>h</b>: class width.</div>
</div>

<div class="formula">
<h3>Grouped mode</h3>
<div class="eq">
<math display="block">
  <mrow>
    <msub><mi>Mo</mi><mi>g</mi></msub>
    <mo>=</mo>
    <msub><mi>L</mi><mi>mo</mi></msub>
    <mo>+</mo>
    <mrow>
      <mo>[</mo>
      <mfrac>
        <mrow><msub><mi>f</mi><mi>mo</mi></msub><mo>−</mo><msub><mi>f</mi><mrow><mi>mo</mi><mo>−</mo><mn>1</mn></mrow></msub></mrow>
        <mrow>
          <mo>(</mo><msub><mi>f</mi><mi>mo</mi></msub><mo>−</mo><msub><mi>f</mi><mrow><mi>mo</mi><mo>−</mo><mn>1</mn></mrow></msub><mo>)</mo>
          <mo>+</mo>
          <mo>(</mo><msub><mi>f</mi><mi>mo</mi></msub><mo>−</mo><msub><mi>f</mi><mrow><mi>mo</mi><mo>+</mo><mn>1</mn></mrow></msub><mo>)</mo>
        </mrow>
      </mfrac>
      <mo>]</mo>
    </mrow>
    <mi>h</mi>
  </mrow>
</math>
</div>
<div class="tpl">=L_mo+((f_mo-f_prev)/((f_mo-f_prev)+(f_mo-f_next)))*h</div>
<div class="symbols"><b>L<sub>mo</sub></b>: lower limit of modal class · <b>f<sub>mo</sub></b>: modal-class frequency · <b>f<sub>prev</sub></b>: previous-class frequency · <b>f<sub>next</sub></b>: next-class frequency · <b>h</b>: class width.</div>
</div>

</div>

function render(d){
  window.DATA=d;
  let h=`<section class="card"><h1>${esc(d.title)}</h1><p>Find the <b>DATA CODE</b> shown in evPraxis, click <b>COPY DATA TO EXCEL</b>, and paste the data into Excel.</p></section>`;
  h += '<nav>'+d.blocks.map(b=>`<a href="#${b.code}">${b.code}</a>`).join('')+'</nav>';
  h += formulaHTML;
  d.blocks.forEach((b,i)=>{
    h += `<section class="card" id="${b.code}"><div class="code">DATA CODE: ${b.code}</div>`;
    h += b.tables.map(tableHTML).join('');
    h += `<button class="copy" onclick="copyBlock(${i},this)">COPY DATA TO EXCEL</button></section>`;
  });
  app.innerHTML=h;
  app.style.display='block';
  status.style.display='none';
}

decrypt().then(render).catch(()=>{status.textContent='Invalid access link.'});
