th,td{border:1px solid #9fa9b4;padding:7px 10px;text-align:center;white-space:nowrap} th{background:#eef2f6}
.copy{margin-top:4px;background:var(--ok)} .hidden{display:none} .instructions{background:#eef4ff;border-left:5px solid var(--accent)}
.code{display:inline-block;background:var(--code);border:1px solid #e8d58c;border-radius:8px;padding:7px 11px;font-weight:800;letter-spacing:.5px;margin-bottom:8px}
.note{font-size:13px;color:var(--muted);margin-top:8px}

const keyId=new URLSearchParams(location.search).get('k');
const payload=payloads[keyId];
const enc=new TextEncoder(),dec=new TextDecoder();
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decrypt(password){
  if(!payload)throw new Error('badlink');
  const material=await crypto.subtle.importKey('raw',enc.encode(password),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(payload.salt),iterations:250000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(payload.iv)},key,b64(payload.ct));
  return JSON.parse(dec.decode(plain));
}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function tableHTML(rows){let h='<div class="table-wrap"><table>';rows.forEach((r,i)=>{h+='<tr>'+r.map(c=>`<${i===0?'th':'td'}>${esc(c)}</${i===0?'th':'td'}>`).join('')+'</tr>'});return h+'</table></div>';}
function tsv(q){return q.tables.map(rows=>rows.map(r=>r.join('\t')).join('\n')).join('\n\n');}
async function copyBlock(i,btn){
  const q=window.examData.questions[i];
  await navigator.clipboard.writeText(tsv(q));
  const old=btn.textContent; btn.textContent='COPIED — PASTE IN EXCEL';
  setTimeout(()=>btn.textContent=old,1600);
}
function render(d){
  window.examData=d;
  let h=`<div class="card instructions"><h1>${esc(d.title)}</h1><p><b>Use the DATA CODE shown in evPraxis.</b> Find the same code below, click <b>COPY DATA TO EXCEL</b>, switch to Excel, and press <b>Ctrl+V</b>.</p></div>`;
  h+='<nav>'+d.questions.map(q=>`<a href="#${q.code}">${q.code}</a>`).join('')+'</nav>';
  d.questions.forEach((q,i)=>{
    h+=`<section class="card" id="${q.code}"><div class="code">DATA CODE: ${q.code}</div>`;
    q.tables.forEach(rows=>h+=tableHTML(rows));
    h+=`<button class="copy" onclick="copyBlock(${i},this)">COPY DATA TO EXCEL</button><div class="note">If two tables are shown under this code, both are copied together with one click.</div></section>`;
  });
  document.getElementById('content').innerHTML=h;
  document.getElementById('lock').classList.add('hidden');
  document.getElementById('content').classList.remove('hidden');
  if(location.hash)setTimeout(()=>document.querySelector(location.hash)?.scrollIntoView(),50);
}
async function unlock(){
  const msg=document.getElementById('msg'),pw=document.getElementById('pw').value;
  if(!payload){msg.textContent='Invalid access link.';msg.className='msg bad';return;}
  msg.textContent='Opening…';msg.className='msg';
  try{const d=await decrypt(pw);msg.textContent='';render(d);}
  catch(e){msg.textContent=e.message==='badlink'?'Invalid access link.':'Incorrect password.';msg.className='msg bad';}
}
document.getElementById('unlockBtn').addEventListener('click',unlock);
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock();});
if(!payload){document.getElementById('msg').textContent='Invalid access link.';document.getElementById('msg').className='msg bad';}
</script>
