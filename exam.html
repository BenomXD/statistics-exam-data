<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Statistics Exam Data</title>
<style>
:root{--bg:#f5f7fa;--card:#fff;--ink:#17202a;--muted:#66717d;--line:#d8dee6;--accent:#2057a6;--ok:#137a4b;--bad:#b3261e;--code:#fff7db;--formula:#f7fbf8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--ink)}
.wrap{max-width:1100px;margin:0 auto;padding:24px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:0 3px 14px rgba(0,0,0,.05);margin:16px 0}
h1{font-size:25px;margin:0 0 8px} h2{font-size:20px;margin:0 0 14px} h3{margin:0 0 10px}
.muted{color:var(--muted)} .unlock{max-width:560px;margin:8vh auto 0}
.row{display:flex;gap:10px;flex-wrap:wrap} input{flex:1;min-width:220px;font:inherit;padding:12px;border:1px solid var(--line);border-radius:9px}
button{font:inherit;font-weight:700;padding:11px 15px;border:0;border-radius:9px;background:var(--accent);color:#fff;cursor:pointer}
button:hover{filter:brightness(.95)} .msg{margin-top:10px;font-weight:700} .bad{color:var(--bad)} .ok{color:var(--ok)}
.hidden{display:none} .instructions{background:#eef4ff;border-left:5px solid var(--accent)}
.code{display:inline-block;background:var(--code);border:1px solid #e8d58c;border-radius:8px;padding:7px 11px;font-weight:800;letter-spacing:.5px;margin-bottom:10px}
.data-nav{display:flex;gap:7px;flex-wrap:wrap;margin:16px 0}
.data-nav a{background:#fff;border:1px solid var(--line);padding:7px 10px;border-radius:8px;color:var(--accent);text-decoration:none;font-weight:700}
.table-title{font-weight:800;font-size:17px;margin:10px 0 7px}
.table-wrap{overflow:auto;margin:0 0 16px}
table{border-collapse:collapse;background:#fff}
th,td{border:1px solid #9fa9b4;padding:8px 11px;text-align:center;white-space:nowrap}
th{background:#eef2f6}
.raw-table{table-layout:fixed;width:min(100%,650px)}
.raw-table td{width:auto}
.data-table{min-width:560px}
.copy{margin-top:2px;background:var(--ok)}
.note{font-size:13px;color:var(--muted);margin-top:8px}
.formula-section{background:var(--formula)}
.formula-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:14px;margin-top:16px}
.formula-card{border:1px solid #cfdad2;background:#fff;border-radius:12px;padding:16px}
.equation{font-family:"Cambria Math","Times New Roman",serif;font-size:25px;display:flex;align-items:center;justify-content:center;gap:7px;min-height:82px;overflow-x:auto;padding:8px}
.frac{display:inline-flex;flex-direction:column;align-items:stretch;text-align:center;vertical-align:middle;line-height:1.15}
.frac>span:first-child{border-bottom:1.7px solid currentColor;padding:0 7px 4px}
.frac>span:last-child{padding-top:4px}
.xbar{text-decoration:overline;text-decoration-thickness:1.5px}
.xtilde{position:relative} .xtilde:before{content:"˜";position:absolute;left:0;right:0;top:-.62em;text-align:center}
.bracket,.paren{font-size:1.45em}
.template-row{display:flex;gap:8px;align-items:center;background:#f2f4f6;border-radius:8px;padding:8px;overflow:auto}
.template-row code{font-size:13px;white-space:nowrap}
button.mini{padding:7px 9px;font-size:12px;flex:0 0 auto;background:#3a5f8a}
.symbols{font-size:13px;line-height:1.45;color:#46515c;margin:10px 0 0}
.quick-calc{margin-top:17px;border-top:1px solid #d7e1da;padding-top:15px}
.quick-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.quick-grid>div{background:#fff;border:1px solid #d7e1da;border-radius:9px;padding:11px;font-size:14px;line-height:1.45}
.quick-grid code{font-size:13px}
@media(max-width:650px){.equation{font-size:21px}.card{padding:16px}}
</style>
</head>

const CACHE_MS=60*60*1000;
const keyId=new URLSearchParams(location.search).get('k');
const payload=payloads[keyId];
const enc=new TextEncoder(),dec=new TextDecoder();
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function decrypt(password){
  if(!payload)throw new Error('badlink');
  const material=await crypto.subtle.importKey('raw',enc.encode(password),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(payload.salt),iterations:250000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(payload.iv)},key,b64(payload.ct));
  return JSON.parse(dec.decode(plain));
}

function tableHTML(t){
  const cls=t.kind==='raw'?'raw-table':'data-table';
  let h=`<div class="table-title">${esc(t.title||'')}</div><div class="table-wrap"><table class="${cls}">`;
  t.rows.forEach((r,i)=>{
    h+='<tr>'+r.map(c=>`<${t.kind!=='raw'&&i===0?'th':'td'}>${esc(c)}</${t.kind!=='raw'&&i===0?'th':'td'}>`).join('')+'</tr>';
  });
  return h+'</table></div>';
}

function tsv(block){
  return block.tables.map(t=>t.rows.map(r=>r.join('\t')).join('\n')).join('\n\n');
}
async function copyBlock(i,btn){
  const block=window.examData.blocks[i];
  await navigator.clipboard.writeText(tsv(block));
  const old=btn.textContent; btn.textContent='COPIED — PASTE IN EXCEL';
  setTimeout(()=>btn.textContent=old,1600);
}
function copyTemplate(btn){
  navigator.clipboard.writeText(btn.dataset.copy);
  const old=btn.textContent; btn.textContent='COPIED';
  setTimeout(()=>btn.textContent=old,1200);
}

function render(d){
  window.examData=d;
  let h=`<section class="card instructions"><h1>${esc(d.title)}</h1><p><b>Fast workflow:</b> find the DATA CODE shown in your evPraxis question, click <b>COPY DATA TO EXCEL</b>, switch to Excel, and press <b>Ctrl+V</b>. The raw-data tables use equal-width columns on this page. The copied content remains plain tab-separated data for Excel.</p><p class="note">This browser remembers the unlocked group on this device for up to 60 minutes, so opening another data-code link should not require the password again.</p></section>`;
  h+="\n<section class=\"card formula-section\" id=\"formulas\">\n  <div class=\"formula-head\">\n    <div>\n      <h1>Grouped-data formulas</h1>\n      <p class=\"muted\">The mathematical formula is shown first. The line below is an Excel-style template using symbols instead of cell addresses. Replace the symbols with your values or cell references.</p>\n    </div>\n  </div>\n\n  <div class=\"formula-grid\">\n    <article class=\"formula-card\">\n      <h3>Grouped mean</h3>\n      <div class=\"equation\"><span class=\"xbar\">x</span><sub>g</sub> = <span class=\"frac\"><span>\u03a3 f<sub>i</sub>x<sub>i</sub></span><span>n</span></span></div>\n      <div class=\"template-row\"><code>=SUMAPRODUCTO(f_i,x_i)/SUMA(f_i)</code><button class=\"mini\" data-copy=\"=SUMAPRODUCTO(f_i,x_i)/SUMA(f_i)\">COPY</button></div>\n      <p class=\"symbols\"><b>f<sub>i</sub></b>: class frequency \u00b7 <b>x<sub>i</sub></b>: class midpoint \u00b7 <b>n</b>: \u03a3f<sub>i</sub></p>\n    </article>\n\n    <article class=\"formula-card\">\n      <h3>Grouped median</h3>\n      <div class=\"equation\"><span class=\"xtilde\">x</span><sub>g</sub> = L<sub>m</sub> + <span class=\"paren\">(</span><span class=\"frac\"><span>n/2 \u2212 F<sub>m\u22121</sub></span><span>f<sub>m</sub></span></span><span class=\"paren\">)</span>h</div>\n      <div class=\"template-row\"><code>=L_m+((n/2-F_prev)/f_m)*h</code><button class=\"mini\" data-copy=\"=L_m+((n/2-F_prev)/f_m)*h\">COPY</button></div>\n      <p class=\"symbols\"><b>L<sub>m</sub></b>: lower limit of the median class \u00b7 <b>F<sub>m\u22121</sub></b>: cumulative frequency before the median class \u00b7 <b>f<sub>m</sub></b>: median-class frequency \u00b7 <b>h</b>: class width</p>\n    </article>\n\n    <article class=\"formula-card\">\n      <h3>Grouped mode</h3>\n      <div class=\"equation\">Mo<sub>g</sub> = L<sub>mo</sub> + <span class=\"bracket\">[</span><span class=\"frac\"><span>f<sub>mo</sub> \u2212 f<sub>mo\u22121</sub></span><span>(f<sub>mo</sub> \u2212 f<sub>mo\u22121</sub>) + (f<sub>mo</sub> \u2212 f<sub>mo+1</sub>)</span></span><span class=\"bracket\">]</span>h</div>\n      <div class=\"template-row\"><code>=L_mo+((f_mo-f_prev)/((f_mo-f_prev)+(f_mo-f_next)))*h</code><button class=\"mini\" data-copy=\"=L_mo+((f_mo-f_prev)/((f_mo-f_prev)+(f_mo-f_next)))*h\">COPY</button></div>\n      <p class=\"symbols\"><b>L<sub>mo</sub></b>: lower limit of the modal class \u00b7 <b>f<sub>mo</sub></b>: modal-class frequency \u00b7 <b>f<sub>prev</sub></b>: previous-class frequency \u00b7 <b>f<sub>next</sub></b>: next-class frequency \u00b7 <b>h</b>: class width</p>\n    </article>\n\n    <article class=\"formula-card\">\n      <h3>Grouped sample standard deviation</h3>\n      <div class=\"equation\">s<sub>g</sub> = \u221a<span class=\"radicand\"><span class=\"frac\"><span>\u03a3 f<sub>i</sub>(x<sub>i</sub> \u2212 <span class=\"xbar\">x</span><sub>g</sub>)\u00b2</span><span>n \u2212 1</span></span></span></div>\n      <div class=\"template-row\"><code>=RAIZ(SUMAPRODUCTO(f_i,(x_i-xbar_g)^2)/(n-1))</code><button class=\"mini\" data-copy=\"=RAIZ(SUMAPRODUCTO(f_i,(x_i-xbar_g)^2)/(n-1))\">COPY</button></div>\n      <p class=\"symbols\"><b>x\u0304<sub>g</sub></b>: grouped mean \u00b7 the other symbols are defined above.</p>\n    </article>\n  </div>\n\n  <div class=\"quick-calc\">\n    <h3>Useful table calculations</h3>\n    <div class=\"quick-grid\">\n      <div><b>Midpoint:</b> x<sub>i</sub> = (Lower + Upper)/2<br><code>=(Lower+Upper)/2</code></div>\n      <div><b>Total frequency:</b> n = \u03a3f<sub>i</sub><br><code>=SUMA(f_i)</code></div>\n      <div><b>Cumulative frequency:</b> F<sub>i</sub> = F<sub>prev</sub> + f<sub>i</sub><br><code>=F_prev+f_i</code></div>\n      <div><b>Frequency from raw data:</b><br><code>=FRECUENCIA(data,upper_limits)</code></div>\n    </div>\n  </div>\n</section>\n";
  h+='<nav class="data-nav">'+d.blocks.map(b=>`<a href="#${b.code}">${esc(b.code)}</a>`).join('')+'</nav>';
  d.blocks.forEach((b,i)=>{
    h+=`<section class="card" id="${esc(b.code)}"><div class="code">DATA CODE: ${esc(b.code)}</div>`;
    b.tables.forEach(t=>h+=tableHTML(t));
    h+=`<button class="copy" onclick="copyBlock(${i},this)">COPY DATA TO EXCEL</button></section>`;
  });
  document.getElementById('content').innerHTML=h;
  document.getElementById('lock').classList.add('hidden');
  document.getElementById('content').classList.remove('hidden');
  document.querySelectorAll('button[data-copy]').forEach(btn=>btn.addEventListener('click',()=>copyTemplate(btn)));
  if(location.hash)setTimeout(()=>document.querySelector(location.hash)?.scrollIntoView({behavior:'smooth',block:'start'}),60);
}

function cacheData(d){
  try{localStorage.setItem('statsExam:'+keyId,JSON.stringify({exp:Date.now()+CACHE_MS,data:d}));}catch(e){}
}
function loadCache(){
  try{
    const x=JSON.parse(localStorage.getItem('statsExam:'+keyId)||'null');
    if(x&&x.exp>Date.now()&&x.data)return x.data;
    localStorage.removeItem('statsExam:'+keyId);
  }catch(e){}
  return null;
}

async function unlock(){
  const msg=document.getElementById('msg'),pw=document.getElementById('pw').value;
  if(!payload){msg.textContent='Invalid access link.';msg.className='msg bad';return}
  msg.textContent='Opening…';msg.className='msg';
  try{const d=await decrypt(pw);cacheData(d);msg.textContent='';render(d)}
  catch(e){msg.textContent=e.message==='badlink'?'Invalid access link.':'Incorrect password.';msg.className='msg bad'}
}
document.getElementById('unlockBtn').addEventListener('click',unlock);
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});
if(!payload){document.getElementById('msg').textContent='Invalid access link.';document.getElementById('msg').className='msg bad'}
else{const cached=loadCache();if(cached)render(cached)}
</script>
</body>
